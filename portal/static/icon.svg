<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#030712" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />

  <g filter="url(#shadow)">
    <!-- Chimney 1 -->
    <rect x="110" y="160" width="32" height="150" fill="#ffffff" rx="4" />
    <polygon points="106,160 146,160 142,148 110,148" fill="#ffffff" />
    <!-- Chimney 2 -->
    <rect x="156" y="195" width="28" height="115" fill="#ffffff" rx="4" />
    <polygon points="152,195 188,195 184,185 156,185" fill="#ffffff" />

    <!-- Sawtooth Factory Roofs -->
    <polygon points="196,310 196,220 256,260 256,310" fill="#ffffff" />
    <polygon points="256,310 256,220 316,260 316,310" fill="#ffffff" />

    <!-- Main Factory Building Base -->
    <rect x="100" y="300" width="226" height="70" fill="#ffffff" rx="6" />

    <!-- Factory Windows -->
    <rect x="120" y="318" width="22" height="18" fill="#1e3a8a" rx="2" />
    <rect x="152" y="318" width="22" height="18" fill="#1e3a8a" rx="2" />
    <rect x="184" y="318" width="22" height="18" fill="#1e3a8a" rx="2" />
    <rect x="216" y="318" width="22" height="18" fill="#1e3a8a" rx="2" />
    <rect x="248" y="318" width="22" height="18" fill="#1e3a8a" rx="2" />
    <rect x="280" y="318" width="22" height="18" fill="#1e3a8a" rx="2" />

    <!-- Factory Gate -->
    <rect x="180" y="342" width="46" height="28" fill="#0284c7" rx="3" />

    <!-- Precision Planning Gear (Gold) -->
    <g transform="translate(360, 200)">
      <circle cx="0" cy="0" r="48" fill="url(#goldGrad)" />
      <path d="M-10,-60 h20 v16 h-20 z" fill="url(#goldGrad)" />
      <path d="M-10,44 h20 v16 h-20 z" fill="url(#goldGrad)" />
      <path d="M-60,-10 h16 v20 h-16 z" fill="url(#goldGrad)" />
      <path d="M44,-10 h16 v20 h-16 z" fill="url(#goldGrad)" />
      <path d="M-45,-45 l14,-14 l14,14 l-14,14 z" fill="url(#goldGrad)" />
      <path d="M31,31 l14,-14 l14,14 l-14,14 z" fill="url(#goldGrad)" />
      <path d="M-45,31 l14,14 l14,-14 l-14,-14 z" fill="url(#goldGrad)" />
      <path d="M31,-45 l14,14 l14,-14 l-14,-14 z" fill="url(#goldGrad)" />
      <circle cx="0" cy="0" r="20" fill="#1e3a8a" />
    </g>

    <!-- Small Interlocking Gear (Cyan) -->
    <g transform="translate(420, 275)">
      <circle cx="0" cy="0" r="32" fill="#38bdf8" />
      <path d="M-7,-42 h14 v12 h-14 z" fill="#38bdf8" />
      <path d="M-7,30 h14 v12 h-14 z" fill="#38bdf8" />
      <path d="M-42,-7 h12 v14 h-12 z" fill="#38bdf8" />
      <path d="M30,-7 h12 v14 h-12 z" fill="#38bdf8" />
      <circle cx="0" cy="0" r="14" fill="#1e3a8a" />
    </g>

    <!-- Store Inventory Pallet Boxes -->
    <g transform="translate(340, 320)">
      <rect x="0" y="44" width="80" height="8" fill="rgba(255,255,255,0.7)" rx="2" />
      <rect x="4" y="16" width="34" height="26" fill="#fbbf24" rx="3" />
      <line x1="21" y1="16" x2="21" y2="42" stroke="#d97706" stroke-width="2" />
      <rect x="42" y="16" width="34" height="26" fill="#f59e0b" rx="3" />
      <line x1="59" y1="16" x2="59" y2="42" stroke="#b45309" stroke-width="2" />
      <rect x="23" y="-12" width="34" height="26" fill="#fcd34d" rx="3" />
      <line x1="40" y1="-12" x2="40" y2="14" stroke="#d97706" stroke-width="2" />
    </g>
  </g>

  <text x="256" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">PARAGON PLAN</text>
  <text x="256" y="465" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="14" font-weight="600" fill="#93c5fd" text-anchor="middle" letter-spacing="3">PRODUCTION &amp; STORE</text>
</svg>